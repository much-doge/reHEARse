name: rehearse

services:
  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://listening:listening@db:5432/listening
      LADDER_START_VERSION: ${LADDER_START_VERSION:-original}
      FEEDBACK_PROVIDER: ${FEEDBACK_PROVIDER:-template}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1/responses}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-60000}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-1800}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-before-deploying}
      SESSION_COOKIE_SECURE: "false"
      MEDIA_ROOT: /app/media
      UPLOAD_DIR: /data/uploads
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      MEDIA_SIGNED_URL_TTL_SECONDS: ${MEDIA_SIGNED_URL_TTL_SECONDS:-600}
      B2_S3_ENDPOINT: ${B2_S3_ENDPOINT:-}
      B2_REGION: ${B2_REGION:-}
      B2_BUCKET_NAME: ${B2_BUCKET_NAME:-}
      B2_APPLICATION_KEY_ID: ${B2_APPLICATION_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - listening_media:/data/uploads
    depends_on:
      seed-demo:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://listening:listening@db:5432/listening
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed-demo:
    build:
      context: .
      target: migrator
    command: ["node", "scripts/seed-demo.mjs"]
    environment:
      DATABASE_URL: postgresql://listening:listening@db:5432/listening
      ALLOW_DEMO_SEED: "true"
      DEMO_LEARNER_EMAIL: ${DEMO_LEARNER_EMAIL:-student@rehearse.local}
      DEMO_LEARNER_PASSWORD: ${DEMO_LEARNER_PASSWORD:-ReHEARse-Learner-2026!}
      DEMO_TEACHER_EMAIL: ${DEMO_TEACHER_EMAIL:-teacher@rehearse.local}
      DEMO_TEACHER_PASSWORD: ${DEMO_TEACHER_PASSWORD:-ReHEARse-Teacher-2026!}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@rehearse.local}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-ReHEARse-Admin-2026!}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  import-activity:
    profiles: ["tools"]
    build:
      context: .
      target: migrator
    entrypoint: ["pnpm", "activity:import", "--"]
    environment:
      DATABASE_URL: postgresql://listening:listening@db:5432/listening
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      UPLOAD_DIR: /data/uploads
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-262144000}
      B2_S3_ENDPOINT: ${B2_S3_ENDPOINT:-}
      B2_REGION: ${B2_REGION:-}
      B2_BUCKET_NAME: ${B2_BUCKET_NAME:-}
      B2_APPLICATION_KEY_ID: ${B2_APPLICATION_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
    volumes:
      - ${REHEARSE_IMPORT_DIR:-./imports}:/imports:ro
      - listening_media:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: listening
      POSTGRES_USER: listening
      POSTGRES_PASSWORD: listening
    volumes:
      - listening_db_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listening -d listening"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  listening_db_v18:
  listening_media:
