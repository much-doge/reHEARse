<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>reHEARse forest companions</title>
  <style>
    :root{color-scheme:light;background:#f3f0e8;color:#17202a;font-family:Inter,system-ui,sans-serif}body{margin:0;padding:32px}main{max-width:1180px;margin:auto}h1{font-family:Georgia,serif;margin-bottom:.25rem}.intro{color:#62706f;margin-top:0}.controls{display:flex;gap:12px;align-items:center;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}.card{background:#fffdf7;border:1px solid #d9d7cf;border-radius:22px;padding:12px;text-align:center}.card svg{width:112px;height:112px;overflow:visible}.card strong{display:block}.card small{color:#62706f}.creature{transform-origin:120px 210px;animation:bounce 2.8s ease-in-out infinite}.sway .creature{animation-name:sway;animation-duration:3.6s}.float .creature{animation-name:float;animation-duration:4s}.eyes{transform-origin:120px 110px;animation:blink 5.2s linear infinite}.left-arm{transform-origin:76px 156px;animation:wave 3.1s ease-in-out infinite}.right-arm{transform-origin:164px 156px;animation:wave-r 3.7s ease-in-out infinite}.accessory{transform-origin:120px 64px;animation:ears 3.1s ease-in-out infinite}body.paused *{animation-play-state:paused!important}@keyframes bounce{0%,100%{transform:translateY(0)}48%{transform:translateY(-9px) scale(.98,1.03)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-4px)}}@keyframes float{0%,100%{transform:translateY(-2px) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}@keyframes wave{0%,45%,100%{transform:rotate(0)}60%,77%{transform:rotate(20deg)}}@keyframes wave-r{0%,30%,100%{transform:rotate(0)}50%,70%{transform:rotate(-23deg)}}@keyframes ears{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media(max-width:560px){body{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card svg{width:88px;height:88px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body><main>
  <h1>Forest companions</h1>
  <p class="intro">Thirty character compositions for reHEARse / Tiga puluh komposisi karakter untuk reHEARse</p>
  <div class="controls"><button id="motion" type="button">Pause motion / Jeda gerak</button><span>Rendered at 112 px; resize the window for the 88 px phone view.</span></div>
  <div class="grid" id="gallery"></div>
</main>
<script>
const avatars=[
['moss','Moss','green','B','B','A',2,'cute','closed_happy','ears','bounce'],['fern','Fern','green','E','A','B',1,'human','A','antenna','sway'],['sprout','Sprout','green','F','C','C',3,'human_blue','C','horns','bounce'],['pickle','Pickle','green','C','D','E',2,'human','H','round-ears','sway'],['clover','Clover','green','A','E','D',1,'cute','B','horns','float'],
['ember','Ember','red','D','C','B',1,'human_blue','B','horns','bounce'],['chili','Chili','red','E','E','D',3,'human','I','none','sway'],['poppy','Poppy','red','B','A','C',2,'cute','A','antenna','float'],['ruby','Ruby','red','A','D','E',2,'human_blue','closed_happy','ears','bounce'],['sizzle','Sizzle','red','F','B','A',1,'human','J','round-ears','sway'],
['bubbles','Bubbles','blue','B','E','D',3,'cute','A','round-ears','float'],['ripple','Ripple','blue','C','A','C',2,'human','C','horns','sway'],['comet','Comet','blue','F','D','B',1,'human_blue','H','antenna','bounce'],['pixel','Pixel','blue','A','B','E',3,'human','closed_happy','none','sway'],['fin','Fin','blue','D','C','A',2,'cute','B','ears','float'],
['cloud','Cloud','white','B','D','E',1,'cute','closed_happy','round-ears','float'],['mochi','Mochi','white','D','B','A',2,'human_blue','A','antenna','bounce'],['wisp','Wisp','white','E','E','C',3,'cute','J','horns','float'],['frost','Frost','white','F','A','D',2,'human','C','ears','sway'],['marsh','Marsh','white','A','C','B',1,'human_blue','H','none','bounce'],
['sunny','Sunny','yellow','B','C','E',2,'human_blue','H','horns','bounce'],['mango','Mango','yellow','C','E','A',1,'cute','C','ears','sway'],['spark','Spark','yellow','F','B','D',3,'human','A','antenna','bounce'],['butter','Butter','yellow','A','A','C',2,'cute','closed_happy','round-ears','float'],['noodle','Noodle','yellow','E','D','B',1,'human','B','none','sway'],
['shadow','Shadow','dark','E','C','C',2,'human_blue','J','horns','float'],['inky','Inky','dark','B','B','E',3,'cute','H','ears','bounce'],['orbit','Orbit','dark','A','E','B',1,'human_blue','A','antenna','float'],['dusk','Dusk','dark','C','D','A',2,'human','closed_happy','none','sway'],['pebble','Pebble','dark','F','A','D',1,'cute','C','round-ears','bounce']];
const dims={A:[58,112,112],B:[55,124,124],C:[48,94,138],D:[54,116,130],E:[38,90,154],F:[42,112,150]};const root='/art/avatars/parts/';
function img(file,x,y,w,h){return `<image href="${root}${file}.png" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="none"/>`}
function render([id,name,color,body,arm,leg,count,eye,mouth,accessory,motion]){const [y,w,h]=dims[body],size=count===1?45:count===2?34:26,gap=count===1?0:count===2?42:30,start=120-(((count-1)*gap+size)/2),eyeFile=eye==='cute'?'eye_cute_light':`eye_${eye}`;let eyes='';for(let i=0;i<count;i++)eyes+=img(eyeFile,start+i*gap,91,size,size);let detail='';if(accessory==='antenna')detail=img(`detail_${color}_antenna_large`,91,12,28,56)+`<g transform="translate(240 0) scale(-1 1)">${img(`detail_${color}_antenna_small`,88,25,24,42)}</g>`;else if(accessory!=='none'){const d=accessory==='ears'?'ear':accessory==='round-ears'?'ear_round':'horn_large';detail=img(`detail_${color}_${d}`,57,y-13,38,42)+`<g transform="translate(240 0) scale(-1 1)">${img(`detail_${color}_${d}`,57,y-13,38,42)}</g>`}return `<article class="card ${motion}"><svg viewBox="0 0 240 240" role="img" aria-label="${name}"><ellipse cx="120" cy="218" rx="56" ry="9" fill="#213f38" opacity=".15"/><g class="creature"><g>${img(`leg_${color}${leg}`,80,151,34,65)}</g><g transform="translate(240 0) scale(-1 1)">${img(`leg_${color}${leg}`,80,151,34,65)}</g><g class="left-arm">${img(`arm_${color}${arm}`,37,80,44,95)}</g><g class="right-arm" transform="translate(240 0) scale(-1 1)">${img(`arm_${color}${arm}`,37,80,44,95)}</g><g class="accessory">${detail}</g>${img(`body_${color}${body}`,120-w/2,y,w,h)}<g class="eyes">${eyes}</g>${img(`mouth${mouth.startsWith('closed')?'_':''}${mouth}`,97,138,46,mouth==='closed_happy'?15:27)}</g></svg><strong>${name}</strong><small>${motion} · ${count} eye${count>1?'s':''}</small></article>`}
document.querySelector('#gallery').innerHTML=avatars.map(render).join('');document.querySelector('#motion').onclick=e=>{document.body.classList.toggle('paused');e.currentTarget.textContent=document.body.classList.contains('paused')?'Play motion / Putar gerak':'Pause motion / Jeda gerak'};
</script></body></html>
