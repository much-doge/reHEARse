name: external service health

on:
  schedule:
    # GitHub-hosted runners are an external vantage point, but schedules can
    # be delayed. This is an operational signal, not an uptime SLA.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: external-service-health
  cancel-in-progress: true

jobs:
  probe:
    name: Probe public services and signal Healthchecks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HEALTHCHECK_CONFIG: monitoring/services.json
      REHEARSE_HEALTH_URL: ${{ vars.REHEARSE_HEALTH_URL || 'https://rehearse.najala.org/api/health' }}
      HC_REHEARSE_PING_URL: ${{ secrets.HC_REHEARSE_PING_URL }}
    steps:
      - name: Probe services and send signals
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/healthchecks-probe.sh
